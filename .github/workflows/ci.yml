name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nyaya_Vault/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Nyaya_Vault/backend/requirements-dev.txt

      # Same system packages the Dockerfile installs for scanned-PDF OCR.
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m spacy download en_core_web_sm

      # No .env exists in CI, and the tests ignore one anyway (see
      # tests/conftest.py) - nothing here can reach a real database or chain.
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Nyaya_Vault/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nyaya_Vault/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
